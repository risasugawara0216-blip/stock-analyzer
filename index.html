<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式チャートAI分析 | Swing Trade Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0a0a0a;--ink2:#3a3a3a;--ink3:#6b6b6b;
  --surface:#ffffff;--surface2:#f5f4f0;--surface3:#eeede8;
  --green:#1a6640;--green-light:#e8f3ed;
  --red:#8b1a1a;--red-light:#f5e8e8;
  --amber:#7a4f00;--amber-light:#fdf3e0;
  --blue:#0d3d6e;--blue-light:#e8f0f8;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.06);
}
body{font-family:'Courier New',monospace;background:var(--surface2);min-height:100vh;padding:24px 16px}
.container{max-width:900px;margin:0 auto;background:var(--surface);border-radius:8px;padding:32px;border:0.5px solid var(--border)}

.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:24px}
.hd-title{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.hd-sub{font-size:11px;color:var(--ink3);margin-top:4px;letter-spacing:0.5px}
.hd-right{text-align:right;font-size:10px;color:var(--ink3);line-height:1.8}

.section-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--ink3);margin-bottom:10px}

.chart-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.upload-zone{border:1px dashed var(--ink3);border-radius:4px;padding:24px 12px;text-align:center;cursor:pointer;transition:all 0.15s;position:relative;background:var(--surface2)}
.upload-zone:hover{border-color:var(--ink);background:var(--surface3)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone .icon{font-size:22px;margin-bottom:6px;font-weight:700;color:var(--ink2)}
.upload-zone .label{font-size:12px;color:var(--ink2)}
.upload-zone .sub{font-size:10px;color:var(--ink3);margin-top:3px}
.chart-preview{position:relative}
.chart-preview img{width:100%;border-radius:4px;border:0.5px solid var(--border);display:block}
.remove-btn{position:absolute;top:6px;right:6px;background:var(--ink);color:#fff;border:none;border-radius:3px;padding:2px 7px;font-size:10px;font-family:'Courier New',monospace;cursor:pointer}

.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.meta-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.field label{display:block;font-size:10px;color:var(--ink3);margin-bottom:3px;letter-spacing:0.5px}
.field input,.field select{width:100%;font-family:'Courier New',monospace;font-size:12px;background:var(--surface2);border:0.5px solid var(--border);border-radius:3px;padding:7px 9px;color:var(--ink)}

.analyze-btn{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:4px;font-size:14px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:1px;cursor:pointer;transition:opacity 0.15s;margin-bottom:24px}
.analyze-btn:hover{opacity:0.85}
.analyze-btn:disabled{opacity:0.35;cursor:not-allowed}

.loading{text-align:center;padding:48px;display:none}
.loading.show{display:block}
.ld-dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.ld-dot{width:9px;height:9px;border-radius:50%;background:var(--ink);animation:pulse 1.2s infinite}
.ld-dot:nth-child(2){animation-delay:0.2s}
.ld-dot:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,100%{opacity:0.2}50%{opacity:1}}
.ld-text{font-size:12px;color:var(--ink3)}

.results{display:none}
.results.show{display:block}

.verdict{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:4px;margin-bottom:18px;border:1px solid}
.verdict.bull{background:var(--green-light);border-color:#b8d9c5;color:var(--green)}
.verdict.bear{background:var(--red-light);border-color:#d9b8b8;color:var(--red)}
.verdict.neut{background:var(--amber-light);border-color:#e8d5a8;color:var(--amber)}
.verdict-icon{font-size:30px;line-height:1}
.verdict-main{font-size:17px;font-weight:700}
.verdict-sub{font-size:12px;margin-top:4px;opacity:0.8}
.verdict-tag{margin-left:auto;font-size:12px;padding:5px 14px;border-radius:20px;font-weight:700;letter-spacing:0.5px;white-space:nowrap}
.verdict.bull .verdict-tag{background:var(--green);color:#fff}
.verdict.bear .verdict-tag{background:var(--red);color:#fff}
.verdict.neut .verdict-tag{background:var(--amber);color:#fff}

.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.a-card{border:0.5px solid var(--border);border-radius:4px;padding:14px}
.a-card-title{font-size:10px;letter-spacing:1px;color:var(--ink3);margin-bottom:10px;font-weight:700;border-bottom:0.5px solid var(--border2);padding-bottom:6px}
.a-item{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:0.5px solid var(--border2);gap:8px}
.a-item:last-child{border-bottom:none}
.a-label{font-size:11px;color:var(--ink3);flex-shrink:0;min-width:90px}
.a-value{font-size:12px;color:var(--ink);text-align:right;font-weight:500;line-height:1.4}
.a-value.bull{color:var(--green)}
.a-value.bear{color:var(--red)}
.a-sub{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.6}

.signals{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sig{font-size:10px;padding:3px 8px;border-radius:3px;font-weight:700;letter-spacing:0.3px}
.sig.bull{background:var(--green-light);color:var(--green)}
.sig.bear{background:var(--red-light);color:var(--red)}
.sig.neut{background:var(--amber-light);color:var(--amber)}
.sig.info{background:var(--blue-light);color:var(--blue)}

.price-table{border:0.5px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:16px}
.pt-header{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:var(--ink);color:#fff;font-size:10px;letter-spacing:0.5px;font-weight:700}
.pt-header div,.pt-row div{padding:9px 13px}
.pt-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:0.5px solid var(--border2);font-size:12px}
.pt-row:nth-child(even){background:var(--surface2)}
.entry{font-weight:700}
.stop-val{color:var(--red);font-weight:700}
.tp1-val{color:var(--green)}
.tp2-val{color:var(--green);font-weight:700}

.scenario-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.sc{border-radius:4px;padding:13px;border:0.5px solid}
.sc.best{background:var(--green-light);border-color:#b8d9c5}
.sc.mid{background:var(--amber-light);border-color:#e8d5a8}
.sc.worst{background:var(--red-light);border-color:#d9b8b8}
.sc-label{font-size:9px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.sc.best .sc-label{color:var(--green)}
.sc.mid .sc-label{color:var(--amber)}
.sc.worst .sc-label{color:var(--red)}
.sc-price{font-size:15px;font-weight:700;margin-bottom:4px}
.sc.best .sc-price{color:var(--green)}
.sc.mid .sc-price{color:var(--amber)}
.sc.worst .sc-price{color:var(--red)}
.sc-desc{font-size:10px;color:var(--ink3);line-height:1.5}

.risk-section{background:var(--red-light);border:0.5px solid #d9b8b8;border-radius:4px;padding:14px;margin-bottom:16px}
.risk-title{font-size:10px;letter-spacing:1px;color:var(--red);font-weight:700;margin-bottom:10px}
.risk-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid rgba(139,26,26,0.1);font-size:12px;color:var(--ink2)}
.risk-item:last-child{border-bottom:none}
.risk-bullet{color:var(--red);font-weight:700;flex-shrink:0}

.full-analysis{border:0.5px solid var(--border);border-radius:4px;padding:16px;margin-bottom:20px;background:var(--surface2)}
.fa-title{font-size:10px;letter-spacing:1px;color:var(--ink3);font-weight:700;margin-bottom:10px}
.fa-content{font-size:12px;color:var(--ink2);line-height:2;white-space:pre-wrap}

.bottom-bar{display:flex;gap:8px;justify-content:flex-end;border-top:0.5px solid var(--border);padding-top:16px}
.btn{padding:9px 18px;font-size:12px;font-family:'Courier New',monospace;border-radius:3px;cursor:pointer;letter-spacing:0.5px;font-weight:700}
.btn-outline{background:transparent;border:0.5px solid var(--border);color:var(--ink)}
.btn-outline:hover{background:var(--surface2)}
.btn-primary{background:var(--ink);color:#fff;border:none}
.btn-primary:hover{opacity:0.85}
.btn-copy{background:var(--green);color:#fff;border:none}
.btn-copy:hover{opacity:0.85}

.error{background:#fff5f5;border:0.5px solid #fca5a5;border-radius:4px;padding:13px;font-size:12px;color:#7f1d1d;margin-bottom:16px;display:none}
.error.show{display:block}


</style>
</head>
<body>
<div class="container">
  <div class="hd">
    <div>
      <div class="hd-title">CHART ANALYZER PRO</div>
      <div class="hd-sub">月足 → 週足 → 日足 AI三段階分析 | スイングトレード専用</div>
    </div>
    <div class="hd-right">
      <div>損切は小さく、利益を伸ばす</div>
      <div>保有期間 2週〜2ヶ月</div>
    </div>
  </div>

  <!-- API KEY - server-side -->
  <div style="background:#e8f3ed;border:0.5px solid #b8d9c5;border-radius:4px;padding:10px 16px;margin-bottom:20px;display:flex;align-items:center;gap:8px">
    <span style="color:#1a6640;font-size:12px;font-weight:700;">✓ APIキー設定済み（サーバー側で管理）</span>
    <span style="color:#3a7a5a;font-size:11px;">— 入力不要でそのまま使えます</span>
  </div>

  <!-- CHART UPLOAD -->
  <div class="section-label" style="margin-bottom:10px">▍ チャートアップロード（月足・週足・日足）</div>
  <div class="chart-grid">
    <div id="slot-0">
      <div class="upload-zone">
        <input type="file" accept="image/*" onchange="handleFile(event,0)">
        <div class="icon">月</div>
        <div class="label">月足チャート</div>
        <div class="sub">クリックまたはドロップ</div>
      </div>
    </div>
    <div id="slot-1">
      <div class="upload-zone">
        <input type="file" accept="image/*" onchange="handleFile(event,1)">
        <div class="icon">週</div>
        <div class="label">週足チャート</div>
        <div class="sub">クリックまたはドロップ</div>
      </div>
    </div>
    <div id="slot-2">
      <div class="upload-zone">
        <input type="file" accept="image/*" onchange="handleFile(event,2)">
        <div class="icon">日</div>
        <div class="label">日足チャート</div>
        <div class="sub">クリックまたはドロップ</div>
      </div>
    </div>
  </div>

  <!-- META -->
  <div class="section-label">▍ 銘柄情報</div>
  <div class="meta-grid">
    <div class="field"><label>銘柄コード</label><input type="text" id="ticker" placeholder="例: 5406"></div>
    <div class="field"><label>銘柄名</label><input type="text" id="stockname" placeholder="例: 神戸製鋼所"></div>
    <div class="field"><label>市場タイプ</label>
      <select id="market-type">
        <option value="individual">個別株（変動率基準8%）</option>
        <option value="nikkei">日経平均（変動率基準8%/16%）</option>
      </select>
    </div>
  </div>
  <div class="meta-grid-4">
    <div class="field"><label>現在値（円）</label><input type="number" id="cur-price" placeholder="2225"></div>
    <div class="field"><label>直近高値（円）</label><input type="number" id="high-price" placeholder="2400"></div>
    <div class="field"><label>直近安値（円）</label><input type="number" id="low-price" placeholder="2054"></div>
    <div class="field"><label>方向性（仮説）</label>
      <select id="direction">
        <option value="auto">AIに判断させる</option>
        <option value="buy">買い（ロング）</option>
        <option value="sell">売り（ショート）</option>
      </select>
    </div>
  </div>

  <button class="analyze-btn" id="analyze-btn" onclick="runAnalysis()">AI 三段階分析を実行する →</button>

  <div class="error" id="error-box"></div>
  <div class="loading" id="loading">
    <div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div>
    <div class="ld-text" id="ld-text">チャートを読み込み中...</div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
const imgs=[null,null,null],b64=[null,null,null];
const labels=['月足','週足','日足'];
const icons=['月','週','日'];

window.addEventListener('load',()=>{


});

function compressImage(dataUrl, maxWidth, quality, cb) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height;
    if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

function handleFile(e,slot){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    compressImage(ev.target.result, 1200, 0.75, compressed => {
      imgs[slot]=compressed;
      b64[slot]=compressed.split(',')[1];
      document.getElementById('slot-'+slot).innerHTML=`
        <div class="chart-preview">
          <img src="${compressed}">
          <button class="remove-btn" onclick="removeSlot(${slot})">✕</button>
        </div>`;
    });
  };
  reader.readAsDataURL(file);
}

function removeSlot(slot){
  imgs[slot]=null;b64[slot]=null;
  document.getElementById('slot-'+slot).innerHTML=`
    <div class="upload-zone">
      <input type="file" accept="image/*" onchange="handleFile(event,${slot})">
      <div class="icon">${icons[slot]}</div>
      <div class="label">${labels[slot]}チャート</div>
      <div class="sub">クリックまたはドロップ</div>
    </div>`;
}

function showError(msg){
  const el=document.getElementById('error-box');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),6000);
}

const loadMsgs=['チャートを読み込み中...','月足で大局水準を確認中...','週足でトレンドの流れを分析中...','日足の転換ポイントを探索中...','移動平均線・RSI・MACDを解析中...','新値更新・変動率・乖離率を計算中...','エントリー・損切・利確ラインを算出中...','リスクシナリオを構築中...'];

async function runAnalysis(){
  
  
  if(!imgs.some(i=>i!==null)){showError('チャート画像を1枚以上アップロードしてください');return;}

  
  document.getElementById('analyze-btn').disabled=true;
  document.getElementById('results').classList.remove('show');
  document.getElementById('loading').classList.add('show');

  let idx=0;
  const timer=setInterval(()=>{
    document.getElementById('ld-text').textContent=loadMsgs[idx%loadMsgs.length];
    idx++;
  },1800);

  const ticker=document.getElementById('ticker').value||'未入力';
  const name=document.getElementById('stockname').value||'';
  const cur=document.getElementById('cur-price').value||'不明';
  const high=document.getElementById('high-price').value||'不明';
  const low=document.getElementById('low-price').value||'不明';
  const market=document.getElementById('market-type').value;
  const dir=document.getElementById('direction').value;

  const content=[];
  imgs.forEach((img,i)=>{
    if(img){
      content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64[i]}});
      content.push({type:'text',text:`上記は${labels[i]}チャートです。`});
    }
  });
  content.push({type:'text',text:`銘柄: ${ticker} ${name}\n現在値: ${cur}円 / 直近高値: ${high}円 / 直近安値: ${low}円\n方向性の仮説: ${dir==='auto'?'AIが判断':dir==='buy'?'買い':'売り'}\n変動率基準: ${market==='nikkei'?'日経平均（8%・16%）':'個別株（8%）'}\n\n以下の分析を行いJSONのみを返してください。`});

  const dirInstruction = dir==='sell'
    ? '【最重要指示】売り（ショート）目線の分析です。verdictは必ずBEAR_ENTRY/WAIT/NO_TRADEのいずれか。BULL_ENTRYは使用禁止。directionは必ず売り。entryは売りエントリー価格。stopは損切（エントリーより高い）。tp1・tp2は買い戻し価格（エントリーより低い）。'
    : dir==='buy'
    ? '【最重要指示】買い（ロング）目線の分析です。verdictは必ずBULL_ENTRY/WAIT/NO_TRADEのいずれか。BEAR_ENTRYは使用禁止。directionは必ず買い。stopはエントリーより低い損切価格。'
    : '';

  const system=`あなたは年間成績+40%を5年以上継続するプロの日本株スイングトレーダーです。月足で水準を見極め、週足で流れを確認し、日足の局面転換ポイントでエントリーするのが基本戦略。保有期間は2週間〜2ヶ月。損切は小さく、利益を伸ばすことを最優先。${dirInstruction ? '

' + dirInstruction : ''}

【分析必須項目】
1. 周期判定: 上昇・下落・横ばいを月足/週足/日足それぞれで判定
2. 移動平均線: 5日・25日・75日・100日の並び・傾き・パーフェクトオーダー有無
3. 高値安値: 切り上げ/切り下げ/横並び を明確に
4. 節目価格: 1000円単位・心理的節目・過去の高値安値
5. 新値更新: 上昇陽線5本連続 or 下落陰線5本連続の有無
6. 直近変動率: ${market==='nikkei'?'日経平均は8%・16%が基準':'個別株は8%が基準'} で過熱度判定
7. 中期線乖離率: 25日MAからの乖離率（大きいほど反転リスク or 動意の証明）
8. RSI: 水準（30/50/70）と方向性
9. MACD: ゴールデン/デッドクロス・ヒストグラムの拡縮

【出力形式】必ずこのJSONのみを返すこと。コードブロック不要。
{"verdict":"BULL_ENTRY|BEAR_ENTRY|WAIT|NO_TRADE","verdict_reason":"判断の核心30字以内","score":0~100,"direction":"買い|売り|様子見","monthly":{"cycle":"","ma_order":"","support":"","resistance":"","comment":""},"weekly":{"cycle":"","ma_order":"","highs_lows":"","comment":""},"daily":{"cycle":"","ma_order":"","trigger":"","rsi":"","macd":"","new_highs_count":"","deviation_rate":"","volatility":"","comment":""},"signals":[{"label":"","type":"bull|bear|neut|info"}],"entry":"","stop":"","tp1":"","tp2":"","rr1":"","rr2":"","hold_period":"","risks":["","","",""],"scenario_best":{"price":"","desc":""},"scenario_mid":{"price":"","desc":""},"scenario_worst":{"price":"","desc":""},"full_analysis":"詳細考察500〜800字"}`;

  try{
    const res=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,system,messages:[{role:'user',content}]})
    });
    const data=await res.json();
    clearInterval(timer);
    document.getElementById('loading').classList.remove('show');
    document.getElementById('analyze-btn').disabled=false;

    if(data.error){showError('APIエラー: '+data.error.message);return;}

    const raw=data.content.map(c=>c.text||'').join('');
    let parsed;
    try{parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());}
    catch(e){showError('解析エラー。もう一度お試しください。');return;}

    renderResults(parsed,ticker,name,cur);
    window._last={parsed,ticker,name,cur};

  }catch(err){
    clearInterval(timer);
    document.getElementById('loading').classList.remove('show');
    document.getElementById('analyze-btn').disabled=false;
    showError('接続エラー: '+err.message);
  }
}

function vc(v){return v==='BULL_ENTRY'?'bull':v==='BEAR_ENTRY'?'bear':'neut';}
function vl(v){return v==='BULL_ENTRY'?'買いエントリー':v==='BEAR_ENTRY'?'売りエントリー':v==='WAIT'?'条件待ち':'見送り';}
function vi(v){return v==='BULL_ENTRY'?'▲':v==='BEAR_ENTRY'?'▼':'◆';}

function renderResults(d,ticker,name,cur){
  const html=`
    <div class="verdict ${vc(d.verdict)}">
      <div class="verdict-icon">${vi(d.verdict)}</div>
      <div>
        <div class="verdict-main">${d.verdict_reason||'—'}</div>
        <div class="verdict-sub">${ticker} ${name} | 現在値 ${cur}円 | スコア ${d.score||'—'}/100</div>
      </div>
      <div class="verdict-tag">${vl(d.verdict)}</div>
    </div>
    <div class="analysis-grid">
      <div class="a-card">
        <div class="a-card-title">月足 MONTHLY</div>
        <div class="a-item"><span class="a-label">サイクル</span><span class="a-value">${d.monthly?.cycle||'—'}</span></div>
        <div class="a-item"><span class="a-label">MA配列</span><span class="a-value">${d.monthly?.ma_order||'—'}</span></div>
        <div class="a-item"><span class="a-label">サポート</span><span class="a-value bull">${d.monthly?.support||'—'}</span></div>
        <div class="a-item"><span class="a-label">レジスタンス</span><span class="a-value bear">${d.monthly?.resistance||'—'}</span></div>
        <div class="a-sub">${d.monthly?.comment||''}</div>
      </div>
      <div class="a-card">
        <div class="a-card-title">週足 WEEKLY</div>
        <div class="a-item"><span class="a-label">サイクル</span><span class="a-value">${d.weekly?.cycle||'—'}</span></div>
        <div class="a-item"><span class="a-label">MA配列</span><span class="a-value">${d.weekly?.ma_order||'—'}</span></div>
        <div class="a-item"><span class="a-label">高値安値</span><span class="a-value">${d.weekly?.highs_lows||'—'}</span></div>
        <div class="a-sub">${d.weekly?.comment||''}</div>
      </div>
      <div class="a-card">
        <div class="a-card-title">日足 DAILY ★</div>
        <div class="a-item"><span class="a-label">サイクル</span><span class="a-value">${d.daily?.cycle||'—'}</span></div>
        <div class="a-item"><span class="a-label">MA配列</span><span class="a-value">${d.daily?.ma_order||'—'}</span></div>
        <div class="a-item"><span class="a-label">トリガー</span><span class="a-value">${d.daily?.trigger||'—'}</span></div>
        <div class="a-item"><span class="a-label">RSI</span><span class="a-value">${d.daily?.rsi||'—'}</span></div>
        <div class="a-item"><span class="a-label">MACD</span><span class="a-value">${d.daily?.macd||'—'}</span></div>
        <div class="a-sub">${d.daily?.comment||''}</div>
      </div>
      <div class="a-card">
        <div class="a-card-title">テクニカル指標</div>
        <div class="a-item"><span class="a-label">新値更新</span><span class="a-value">${d.daily?.new_highs_count||'—'}</span></div>
        <div class="a-item"><span class="a-label">中期線乖離</span><span class="a-value">${d.daily?.deviation_rate||'—'}</span></div>
        <div class="a-item"><span class="a-label">直近変動率</span><span class="a-value">${d.daily?.volatility||'—'}</span></div>
        <div class="signals">${(d.signals||[]).map(s=>`<span class="sig ${s.type}">${s.label}</span>`).join('')}</div>
      </div>
    </div>
    <div class="price-table">
      ${(()=>{
        const isBear = d.verdict==='BEAR_ENTRY'||d.direction==='売り';
        return `<div class="pt-header">
          <div>区分</div><div>価格</div><div>根拠</div><div>比率</div>
        </div>
        <div class="pt-row">
          <div>${isBear?'売りエントリー':'買いエントリー'}</div>
          <div class="entry">${d.entry||'—'}</div>
          <div style="font-size:11px;color:var(--ink3)">${isBear?'戻り確認後売り':'転換確認後買い'}</div>
          <div>—</div>
        </div>
        <div class="pt-row">
          <div>${isBear?'損切（上抜け）':'損切（下抜け）'}</div>
          <div class="stop-val">${d.stop||'—'}</div>
          <div style="font-size:11px;color:var(--ink3)">即時実行</div>
          <div class="stop-val" style="font-size:11px">${d.rr1?'R:R '+d.rr1:'—'}</div>
        </div>
        <div class="pt-row">
          <div>${isBear?'買戻し①（半分）':'利確①（半分）'}</div>
          <div class="tp1-val">${d.tp1||'—'}</div>
          <div style="font-size:11px;color:var(--ink3)">1/2決済</div>
          <div class="tp1-val" style="font-size:11px">${d.rr2?'R:R '+d.rr2:'—'}</div>
        </div>
        <div class="pt-row">
          <div>${isBear?'買戻し②（残り）':'利確②（残り）'}</div>
          <div class="tp2-val">${d.tp2||'—'}</div>
          <div style="font-size:11px;color:var(--ink3)">残り決済</div>
          <div class="tp2-val" style="font-size:11px">${d.hold_period||'—'}</div>
        </div>`;
      })()}
    </div>
    ${(()=>{
      const isBear = d.verdict === 'BEAR_ENTRY' || d.direction === '売り';
      const bestLabel = isBear ? '◎ 本命シナリオ【売り】下落目標' : '◎ 本命シナリオ【買い】上昇目標';
      const midLabel  = isBear ? '○ 利確①【売り】買い戻しライン' : '○ 利確①【買い】利確ライン';
      const worstLabel= isBear ? '× 損切【売り】上抜けで損切' : '× 損切【買い】下抜けで損切';
      return `<div class="scenario-grid">
        <div class="sc best"><div class="sc-label">${bestLabel}</div><div class="sc-price">${d.scenario_best?.price||'—'}</div><div class="sc-desc">${d.scenario_best?.desc||''}</div></div>
        <div class="sc mid"><div class="sc-label">${midLabel}</div><div class="sc-price">${d.scenario_mid?.price||'—'}</div><div class="sc-desc">${d.scenario_mid?.desc||''}</div></div>
        <div class="sc worst"><div class="sc-label">${worstLabel}</div><div class="sc-price">${d.scenario_worst?.price||'—'}</div><div class="sc-desc">${d.scenario_worst?.desc||''}</div></div>
      </div>`;
    })()}
    <div class="risk-section">
      <div class="risk-title">▍ 想定リスク一覧</div>
      ${(d.risks||[]).map(r=>`<div class="risk-item"><span class="risk-bullet">▶</span><span>${r}</span></div>`).join('')}
    </div>
    <div class="full-analysis">
      <div class="fa-title">▍ 総合考察</div>
      <div class="fa-content">${d.full_analysis||''}</div>
    </div>
    <div class="bottom-bar">
      <button class="btn btn-outline" onclick="resetAll()">新規分析</button>
      <button class="btn btn-copy" onclick="copyNotion()">Notionにコピー ✓</button>
    </div>`;
  const el=document.getElementById('results');
  el.innerHTML=html;el.classList.add('show');
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

function copyNotion(){
  const d=window._last?.parsed;
  if(!d)return;
  const {ticker,name,cur}=window._last;
  const date=new Date().toLocaleDateString('ja-JP');
  const text=`# ${ticker} ${name} 分析レポート（${date}）

## 判定: ${d.verdict_reason} ／ ${d.verdict==='BULL_ENTRY'?'買いエントリー':d.verdict==='BEAR_ENTRY'?'売りエントリー':d.verdict==='WAIT'?'条件待ち':'見送り'} ／ スコア: ${d.score}/100

## 三段階分析

### 月足
- サイクル: ${d.monthly?.cycle||'—'}
- MA配列: ${d.monthly?.ma_order||'—'}
- サポート: ${d.monthly?.support||'—'}
- レジスタンス: ${d.monthly?.resistance||'—'}
- ${d.monthly?.comment||''}

### 週足
- サイクル: ${d.weekly?.cycle||'—'}
- MA配列: ${d.weekly?.ma_order||'—'}
- 高値安値: ${d.weekly?.highs_lows||'—'}
- ${d.weekly?.comment||''}

### 日足
- サイクル: ${d.daily?.cycle||'—'}
- MA配列: ${d.daily?.ma_order||'—'}
- エントリートリガー: ${d.daily?.trigger||'—'}
- RSI: ${d.daily?.rsi||'—'}
- MACD: ${d.daily?.macd||'—'}
- 新値更新: ${d.daily?.new_highs_count||'—'}
- 中期線乖離率: ${d.daily?.deviation_rate||'—'}
- 直近変動率: ${d.daily?.volatility||'—'}
- ${d.daily?.comment||''}

## エントリー設定

| 区分 | 価格 |
|---|---|
| エントリー | ${d.entry||'—'} |
| 損切 | ${d.stop||'—'} |
| 利確① | ${d.tp1||'—'} |
| 利確② | ${d.tp2||'—'} |
| 想定保有期間 | ${d.hold_period||'—'} |
| R:R（損切/利確①） | ${d.rr1||'—'} |
| R:R（損切/利確②） | ${d.rr2||'—'} |

## シナリオ
- ◎ 本命: ${d.scenario_best?.price||'—'} ／ ${d.scenario_best?.desc||''}
- ○ 利確①: ${d.scenario_mid?.price||'—'} ／ ${d.scenario_mid?.desc||''}
- × 損切: ${d.scenario_worst?.price||'—'} ／ ${d.scenario_worst?.desc||''}

## 想定リスク
${(d.risks||[]).map((r,i)=>`${i+1}. ${r}`).join('\n')}

## 総合考察
${d.full_analysis||''}`;

  navigator.clipboard.writeText(text).then(()=>{
    const btn=event.target;
    btn.textContent='コピー完了 ✓';
    setTimeout(()=>btn.textContent='Notionにコピー ✓',2000);
  });
}

function resetAll(){
  [0,1,2].forEach(i=>removeSlot(i));
  document.getElementById('results').classList.remove('show');
  ['ticker','stockname','cur-price','high-price','low-price'].forEach(id=>{
    document.getElementById(id).value='';
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
